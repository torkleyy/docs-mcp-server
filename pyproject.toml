[project]
name = "docs-mcp-server"
version = "0.1.0"
description = "Expose a local Markdown documentation folder as an MCP server using LlamaIndex."
authors = [
    {name = "Your Name", email = "you@example.com"},
]
readme = "README.md"
requires-python = ">=3.10"

# Define the runtime dependencies.  Versions are left open so that uv
# can resolve compatible versions automatically.  If you need to pin
# specific versions, add them here.
dependencies = [
    "llama-index",
    "llama-index-tools-mcp",
    "mcp[cli]",
    "openai",
]

[project.optional-dependencies]
ollama = [
    "llama-index-llms-ollama",
    "llama-index-embeddings-ollama",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"